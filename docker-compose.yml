version: '3.8'

services:
  omnirag:
    build: .
    container_name: omnirag-enterprise
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
